# ============================================================
#  Filtros y ajustes del bot. Lo podés editar a mano o desde
#  Telegram (Fase 2). Los precios son con impuestos incluidos:
#  AUD con GST, ARS precio de transferencia/contado.
# ============================================================

destinatarios:
  yo: {activo: true}
  hermano: {activo: false, zona_horaria: Australia/Sydney, fecha_viaje: 2026-12-01}

placas:
  activo: true
  chips: [RTX 5060 Ti 16GB, RTX 5070, RTX 5070 Ti, RTX 5080, RX 9060 XT 16GB, RX 9070, RX 9070 XT]
  vram_min_gb: 12
  precio_max: {AUD: 2600, ARS: 3500000}
  # objetivos: avisa (una vez por tienda y modelo, y de nuevo solo si baja otro 3%) cuando el
  # precio queda por debajo. AUD con GST; ARS precio de transferencia/contado.
  # objetivos de los posts de OzBargain (AUD con GST). Los de las tiendas están en compras.items
  objetivos:
    RTX 5070 Ti: {AUD: 1440}

# CPU: ya comprado (Ryzen 9 9900X, ver compras.comprado): se siguen leyendo los precios para /buscar,
# pero no avisa nada
cpu:
  activo: true
  socket: [AM5]
  nucleos_min: 8

ram:
  activo: true
  tipo: DDR5
  capacidad_gb: [32, 64, 96]
  velocidad_min: 6000
  cl_max: 36
  modulos: 2
  # objetivos de RAM: "capacidad (módulos x GB) velocidad". La velocidad es mínima (un kit 6400
  # también cuenta para "6000"); lo que no se pone, no se exige.
  objetivos:
    32GB (2x16) 6000: {AUD: 500}

# PCs armadas. Australia: posts de OzBargain con alguna de las palabras de abajo. Argentina:
# las secciones de PCs de las tiendas. Avisan solo si traen una placa gpu_min o superior
# (según el orden de perf.yaml; con "RTX" cuentan solo las NVIDIA: 5070 Ti, 4080, 5080, 4090, 5090)
# y el precio queda por debajo del objetivo.
pcs:
  activo: true
  gpu_min: RTX 5070 Ti
  objetivo: {AUD: 3000, ARS: 4000000}
  # (OMEN y Victus: las de HP; cuentan solo si el título trae una placa y no dice laptop)
  palabras_ozbargain: [gaming PC, desktop, prebuilt, OMEN, Victus]
  # Comparación con Argentina: la PC australiana se compara contra lo que sale armarla acá por
  # partes (placa + CPU + RAM + SSD de las tiendas que leemos) más esto, que no seguimos:
  resto_estimado_ars: 550000   # mother + fuente + gabinete, estimado: ajustalo si cambia
  # Es para editar en DaVinci Resolve: ⚠️ si el procesador o el disco quedan cortos
  davinci: {nucleos_min: 12, ssd_min_tb: 2}

# PCs armadas en eBay Australia (API oficial "Browse"). Solo vendedores de Australia, nuevas,
# con placa pcs.gpu_min o superior y procesador Ryzen 7/9, Core i7/i9 o Core Ultra 7/9.
# Hacen falta EBAY_CLIENT_ID y EBAY_CLIENT_SECRET (ver README); sin eso, eBay no se lee.
ebay:
  activo: true
  busquedas: [RTX 5070 Ti, RTX 5080, RTX 5090]
  categoria: 179            # "PC Desktops & All-In-One Computers"
  precio_max_aud: 6000
  cpu_tier_min: 7           # Ryzen 7 / Core i7 / Core Ultra 7 o más
  # vendedores que se siguen de cerca: avisan también si bajan de precio o vuelven a tener stock.
  # usuario de eBay: nombre para mostrar
  vendedores_seguidos:
    hp_official: HP Official Store
  modelos_seguidos: [OMEN, Victus]   # qué buscar en esos vendedores

# Resumen diario: un mensaje por día (desde esta hora, hora argentina) con el mejor precio de
# hoy en 🇦🇷 y 🇦🇺 de cada producto, pasado a pesos y con la diferencia entre países.
# Nombres como en los objetivos: placa = chip; RAM = capacidad (módulos) velocidad mínima;
# PCs = la placa que tiene que traer.
resumen_diario:
  activo: true
  hora: "12:00"
  productos:
    placas: [RTX 5070 Ti, RTX 5080]
    ram: [32GB (2x16) 6000, 64GB (2x32) 6000]
    pcs: [RTX 5070 Ti]

mothers: {activo: true, chipsets: [B850, X870, X870E], wifi: true}
# SSD: los posts de OzBargain avisan (por votos u objetivo); en las tiendas todavía no. Solo M.2 2280
# NVMe Gen4/Gen5 (ni SATA, ni externos, ni Gen3, ni 2230/2242). Modelos y velocidades: ssd_modelos.yaml
ssd: {activo: true, capacidad_tb: [2, 4], gen_min: 4}
fuentes: {activo: true, watts_min: 850, certificacion_min: Gold, atx3: true}
refrigeracion: {activo: true, tipos: [AIO 360, AIO 280]}
gabinetes: {activo: true}
teclados: {activo: true}
mouse: {activo: true}
monitores: {activo: false}

general:
  baja_minima_pct: 5
  ganga_vs_mediana_pct: 15
  votos_ozbargain_urgente: 25
  tope_alertas_que_suenan_por_dia: 6
  silencio_noche: {desde: "00:00", hasta: "08:00"}
  mostrar_tray: true
  combos: false
  # posts de estos vendedores no avisan (marketplaces: vende cualquiera). Usados y
  # reacondicionados ya se descartan siempre.
  marketplaces: [ebay, catch.com.au, mydeal, kogan marketplace, amazon marketplace]
  # excepciones: tiendas oficiales dentro de un marketplace (se reconocen por el "@ ..." del título)
  marketplaces_permitidos: [HP eBay]
  # Traerlo de Australia: una valija extra en el avión, además de la aduana declarada
  valija_extra_aud: 150

# ------------------------------------------------------------
#  Ajustes técnicos (normalmente no hace falta tocarlos)
# ------------------------------------------------------------
avisos:
  re_aviso_baja_pct: 3          # misma tienda+modelo no vuelve a avisar salvo que baje otro 3%
  sospechoso_vs_mediana_pct: 40 # 40% o más bajo la mediana = "sospechoso", no oferta
  horas_historial_para_minimo: 24 # no festejar "mínimo histórico" hasta tener 1 día de datos

frecuencia:
  feeds_cada_min: 20
  tiendas_cada_min: 20
  turnos_tiendas: 2              # las tiendas se reparten en N grupos que se turnan
  fase2_cada_horas: 6            # mothers, SSD, fuentes y refrigeración: se leen cada 6 h (todavía no avisan)
  pausa_si_bloquea_horas: 2      # si una tienda nos frena (captcha, 429, 404 falso), descansa 2 h

stock:
  # si una tienda (o staticICE / HardGamers) no se pudo leer en estas horas, sus productos
  # aparecen como "stock sin confirmar" y al final de la lista
  sin_confirmar_horas: 8
  # lo que viene de staticICE y HardGamers se mira en la página de la tienda real: como mucho
  # estos pedidos por corrida (y 6 por tienda), con pausas y respetando robots.txt
  verificar_por_corrida: 30
  verificacion_vale_horas: 6
  # el Worker de Telegram: de ahí se traen los "❌ Sin stock" que tocaste
  worker_url: https://bot-ofertas.williamjames2907.workers.dev

# ------------------------------------------------------------
#  Lo que te falta comprar: SOLO esto avisa por bajas de precio en las tiendas.
#  Argentina: objetivo en USD MEP del día, sobre el precio real (transferencia o cuotas
#  pasadas a contado, lo que sea menor). Australia: AUD con GST.
# ------------------------------------------------------------
compras:
  comprado: {cpu: Ryzen 9 9900X}     # esas categorías no avisan más
  hermano:
    franquicia_usd: 500              # una sola para TODO lo que traiga: la aduana va sobre el total
    trae: [ram, placas, ssd, mouse]  # esto se busca en 🇦🇺 y 🇦🇷; lo demás, solo en 🇦🇷
    viaje: principios de diciembre
  items:
    - {nombre: RTX 5070 Ti, categoria: placas, chip: RTX 5070 Ti, objetivo: {AUD: 1440, USD: 1250}}
    - nombre: RAM DDR5 32GB (2x16) 6000 CL30-36
      categoria: ram
      ram: 32GB (2x16) 6000
      cl_min: 30
      cl_max: 36
      objetivo: {AUD: 500, USD: 520}
    # 990 Pro, SN850X, MP700 PRO "o similar": M.2 Gen4/Gen5 2TB de 7000 MB/s o más (ssd_modelos.yaml)
    - {nombre: SSD M.2 2TB Gen4/Gen5, categoria: ssd, capacidad_tb: 2, gen_min: 4, lectura_min: 7000,
       objetivo: {AUD: 380, USD: 230}}
    - nombre: Mother B850 WiFi (ASUS TUF o equivalente)
      categoria: mothers
      chipsets: [B850]
      wifi: true
      lineas: [TUF, ROG STRIX, TOMAHAWK, MPG, AORUS ELITE, AORUS PRO, AORUS MASTER, STEEL LEGEND, TAICHI, PROART]
    - {nombre: Fuente 850W 80+ Gold ATX 3.1, categoria: fuentes, watts_min: 850, certificacion_min: Gold, atx_min: 3.1}
    # mid tower con lugar para un radiador de 360: el título dice "360" o es uno de estos modelos
    - nombre: Gabinete mid tower (radiador 360)
      categoria: gabinetes
      modelos_360: [LANCOOL 207, LANCOOL 215, LANCOOL 216, LANCOOL 217, LANCOOL III, O11 DYNAMIC, O11 VISION,
                    VECTOR, H5 FLOW, H6 FLOW, H7 FLOW, H9 FLOW, 3500X, 4000D, 4000X, 5000D, 5000X, 6500X,
                    NORTH, MESHIFY 2, TORRENT, AIR 903, KING 95, SKY TWO, XT PRO, NX800, CX600]
    - {nombre: Cooler AIO 360, categoria: refrigeracion, radiador: 360}
    # teclado y mouse: decime qué modelos y los agrego acá (palabras del título, ej. [G502 X, VIPER V3])
    - {nombre: Teclado, categoria: teclados, modelos: []}
    - {nombre: Mouse, categoria: mouse, modelos: []}

# baja que avisa: X% abajo de la mediana de 30 días (en 🇦🇷, en USD MEP). Las placas también avisan
# con un mínimo histórico; bajo el objetivo avisa siempre.
umbrales_baja: {placas: 8, ram: 10, ssd: 10, mothers: 10, fuentes: 10, gabinetes: 10, refrigeracion: 10,
                teclados: 15, mouse: 15}

cuotas:
  # para pasar las cuotas a contado: % mensual, o plazo_fijo (la TNA mediana de los bancos / 12,
  # de api.argentinadatos.com, una vez por día)
  tasa_mensual_pct: plazo_fijo
  # las promos de un banco solo cuentan para el precio real si tenés esa tarjeta (ej. [ICBC, Galicia]);
  # las de todos los bancos, MODO y Mercado Pago cuentan siempre. Se muestran todas igual.
  mis_tarjetas: []
  fichas_hardgamers_por_corrida: 8   # fichas de HardGamers (mínimo de 75 días e historial) por corrida
  fichas_tiendas_por_corrida: 10     # páginas de producto (cuotas) por corrida, 3 por tienda como mucho

black_friday:
  desde: 2026-11-20
  hasta: 2026-12-02
  ofertas_desde: 2026-11-27        # los 14 días antes se miran para el "⚠️ descuento inflado"
  feeds_cada_min: 10
  tiendas_cada_min: 10             # cada tienda, cada 20 min (2 turnos)
  fase2_cada_horas: 3
  votos_ozbargain_urgente: 15
  tope_alertas_que_suenan_por_dia: 12
  # resumen de lo que te falta comprar (hora argentina)
  resumen:
    activo: true
    dias: [2026-11-27]
    horas: ["09:00", "13:00", "20:00"]

foros:
  ozbargain:
    - https://www.ozbargain.com.au/cat/computing/deals/feed
    # por tienda: muchas ofertas de Amazon, eBay y JB Hi-Fi no caen en "Computing"
    - https://www.ozbargain.com.au/deals/amazon.com.au/feed
    - https://www.ozbargain.com.au/deals/ebay.com.au/feed
    - https://www.ozbargain.com.au/deals/scorptec.com.au/feed
    - https://www.ozbargain.com.au/deals/pccasegear.com/feed
    - https://www.ozbargain.com.au/deals/jbhifi.com.au/feed
  # Reddit quedó afuera de la Fase 1 (RSS cortado el 13/11/2026, API sin acceso nuevo).
