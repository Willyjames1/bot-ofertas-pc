    - Ryzen 9 9900X3D
    # 16 núcleos
    - Ryzen 9 7950X
    - Ryzen 9 7950X3D
    - Ryzen 9 9950X
    - Ryzen 9 9950X3D
    - Ryzen 9 9950X3D2

