  # dentro de cada grupo, la generación (7000 < 9000) y cada X3D va arriba de su mismo
  # modelo sin X3D (7700X < 7800X3D, 9700X < 9800X3D < 9850X3D, 9950X < 9950X3D < 9950X3D2).
  cpu:
    # 6 núcleos
    - Ryzen 5 7600
    - Ryzen 5 7600X
    - Ryzen 5 7600X3D
    - Ryzen 5 9600
    - Ryzen 5 9600X
    # 8 núcleos
    - Ryzen 7 7700
    - Ryzen 7 7700X
    - Ryzen 7 7800X3D
