# ============================================================
#  Índice de rendimiento relativo (editable).
#  juegos: 1440p, promedio de rasterizado. davinci: edición en DaVinci Resolve Studio.
#  Base 100: RTX 5080 (placas) y Ryzen 9 9950X (cpu, davinci) / Ryzen 7 9800X3D (cpu, juegos).
#
#  ⚠️ NÚMEROS PROVISORIOS: todavía NO se usan para nada. En la Fase 2 se reemplazan por los
#  de las fuentes de abajo, con el link de cada review, y recién ahí alimentan /top y el resumen.
#
#  Para edición: las RTX 50 decodifican por hardware H.264/H.265 4:2:2 10-bit (lo que graba
#  la FX30). Las RTX 40 y las Radeon no, así que en "davinci" quedan penalizadas.
# ============================================================

# ------------------------------------------------------------
#  ORDEN DE GAMAS (de MENOR a MAYOR). Es lo único que usa la "oportunidad fuerte" en la
#  Fase 1: suena si un modelo que está MÁS ABAJO en la lista cuesta igual o más que uno de más
#  arriba, siempre dentro de tus filtros. Movelos o borralos a gusto. Los números de abajo
#  todavía no se usan.
# ------------------------------------------------------------
