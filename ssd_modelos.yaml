- nombre: Crucial T700
  marca: Crucial
  alias: [T700]
  gen: 5
  velocidad: {1: [11700, 9500], 2: [12400, 11800], 4: [12400, 11800]}
- nombre: Corsair MP700 Pro
  marca: Corsair
  alias: [MP700 PRO]
  gen: 5
  velocidad: {1: [11700, 9600], 2: [12400, 11800], 4: [12400, 11800]}

