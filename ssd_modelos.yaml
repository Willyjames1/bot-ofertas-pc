# SSD conocidos: generación PCIe y velocidades de fábrica (lectura/escritura secuencial, MB/s).
#
# Los usan /buscar, los avisos y el resumen cuando el título no dice la generación o la velocidad
# (si el título trae "7450/6900 MB/s", manda el título; la generación de la tabla manda siempre:
# hay tiendas que ponen "Gen5" a un 990 Evo Plus porque anda en 5.0 x2).
#
#   nombre     cómo se muestra ("Samsung 990 Pro 2TB · Gen4 · …")
#   marca      la misma que detecta el normalizador (si el título es de otra marca no se usa:
#              "XPG Mars 980 Pro" no es un Samsung 980 Pro)
#   alias      cómo aparece en los títulos, sin la marca. Da igual mayúsculas y espacios
#              ("990PRO", "990 pro"); tiene que ser la palabra entera ("MP44" no agarra "MP44L")
#   gen        4 o 5 (3 = PCIe 3.0, 0 = SATA)
#   velocidad  por capacidad en TB: [lectura, escritura] (escritura null si no está publicada).
#              Sin "velocidad", o sin esa capacidad, sale "vel. s/d" (salvo que el título la diga)
#
# Después de tocarlo: python -m bot generar-worker (el Worker usa la misma tabla) y subirlo.

# ---------------------------------------------------------------- Gen5
- nombre: Samsung 9100 Pro
  marca: Samsung
  alias: [9100 PRO]
  gen: 5
  velocidad: {1: [14700, 13300], 2: [14700, 13400], 4: [14800, 13400], 8: [14800, 13400]}
