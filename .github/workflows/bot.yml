name: bot de ofertas

on:
  # Respaldo: GitHub lo corre "más o menos" cada 10 min (a veces se atrasa).
  # El disparo puntual lo hace cron-job.org con workflow_dispatch.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Nunca dos corridas a la vez (se pisarían la base)
concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Traer la base de la rama "datos"
        run: |
          mkdir -p datos
          if git fetch --depth=1 origin datos 2>/dev/null; then
            git show FETCH_HEAD:precios.db > datos/precios.db
            ls -lh datos/precios.db
          else
            echo "Primera corrida: todavía no hay rama datos"
          fi

      - name: Correr el bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID_YO: ${{ secrets.TELEGRAM_CHAT_ID_YO }}
          TELEGRAM_CHAT_ID_HERMANO: ${{ secrets.TELEGRAM_CHAT_ID_HERMANO }}
          BOT_DB: datos/precios.db
        run: python -m bot correr

      - name: Guardar la base (un solo commit, se pisa cada vez)
        if: always()
        run: |
          test -f datos/precios.db || exit 0
          cd datos
          git init -q -b datos
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add precios.db
          git commit -q -m "datos $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos:datos
