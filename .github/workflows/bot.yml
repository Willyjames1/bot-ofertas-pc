name: bot de ofertas

on:
  # El disparo principal lo hace cron-job.org (workflow_dispatch cada 10 min).
  # Esto es solo un respaldo, cada 30 min en los minutos 5 y 35 para no caer junto con
  # cron-job.org (GitHub igual suele atrasarse o saltearse corridas programadas).
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Mandar un mensaje de prueba a Telegram antes de correr"
        type: boolean
        default: false

# Nunca dos corridas a la vez (se pisarían la base)
concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Traer la base de la rama "datos"
        run: |
          mkdir -p datos
          if git fetch --depth=1 origin datos 2>/dev/null; then
            git show FETCH_HEAD:precios.db > datos/precios.db
            ls -lh datos/precios.db
          else
            echo "Primera corrida: todavía no hay rama datos"
          fi

      - name: Mensaje de prueba
        if: ${{ inputs.prueba }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID_YO: ${{ secrets.TELEGRAM_CHAT_ID_YO }}
        run: python -m bot prueba

      - name: Correr el bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID_YO: ${{ secrets.TELEGRAM_CHAT_ID_YO }}
          TELEGRAM_CHAT_ID_HERMANO: ${{ secrets.TELEGRAM_CHAT_ID_HERMANO }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          WORKER_SYNC_SECRET: ${{ secrets.WORKER_SYNC_SECRET }}
          BOT_DB: datos/precios.db
        run: python -m bot correr

      - name: Guardar la base (un solo commit, se pisa cada vez)
        if: always()
        run: |
          test -f datos/precios.db || exit 0
          # Commit "huérfano" con precios.db y precios.json (lo que lee el Worker de /buscar),
          # armado sin tocar la rama main y empujado con las credenciales que ya dejó actions/checkout.
          BLOB=$(git hash-object -w datos/precios.db)
          ARBOL=$(printf '100644 blob %s\tprecios.db\n' "$BLOB")
          # precios.json y los chicos que lee el Worker (precios-indice.json, precios-placas.json…)
          for f in datos/precios*.json; do
            [ -f "$f" ] || continue
            JSON=$(git hash-object -w "$f")
            ARBOL="$ARBOL"$'\n'$(printf '100644 blob %s\t%s' "$JSON" "$(basename "$f")")
          done
          TREE=$(printf '%s\n' "$ARBOL" | git mktree)
          COMMIT=$(git -c user.name="bot-ofertas" -c user.email="bot-ofertas@users.noreply.github.com" \
                   commit-tree "$TREE" -m "datos $(date -u +%FT%TZ)")
          git push -q -f origin "$COMMIT:refs/heads/datos"
